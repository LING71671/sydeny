# ==============================================================================
# LLaMA-Factory SFT Configuration for Sydney (MiniCPM5-2B + LoRA)
# ==============================================================================

# Model Configuration
model_name_or_path: openbmb/MiniCPM5-2B
trust_remote_code: true

# Method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

# Dataset
dataset: sydney_zh_v2_train
eval_dataset: sydney_zh_v2_eval
dataset_dir: ./dataset
template: minicpm5
enable_thinking: true
preserve_thinking: false
train_on_prompt: false
mask_history: false
cutoff_len: 2048

# Training Hyperparameters
output_dir: ./output/sydney_minicpm5_lora
overwrite_output_dir: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
per_device_eval_batch_size: 1
eval_accumulation_steps: 1
learning_rate: 5.0e-5
num_train_epochs: 2.5
lr_scheduler_type: cosine
warmup_steps: 4
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
flash_attn: sdpa
optim: adamw_torch

# Logging & Evaluation Strategy
logging_steps: 1
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: none
seed: 42
data_seed: 42
